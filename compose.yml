services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: money_transfer
      POSTGRES_USER: money_transfer
      POSTGRES_PASSWORD: money_transfer
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U money_transfer -d money_transfer"]
      interval: 5s
      timeout: 3s
      retries: 15
    volumes:
      - postgres-data:/var/lib/postgresql/data

  app:
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      DB_URL: jdbc:postgresql://postgres:5432/money_transfer
      DB_USERNAME: money_transfer
      DB_PASSWORD: money_transfer
      BUSINESS_TIME_ZONE: Africa/Lagos
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

volumes:
  postgres-data:
